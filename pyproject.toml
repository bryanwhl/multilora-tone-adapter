[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multilora-tone-adapter"
version = "0.1.0"
description = "Private Telegram exports to a local Qwen style adapter, orchestrated by Codex."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=6,<8", "huggingface-hub>=0.30,<2"]

[project.optional-dependencies]
mlx = ["mlx-lm[train]>=0.29,<0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
multilora = "multilora_tone_adapter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

